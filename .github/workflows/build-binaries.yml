name: Build native binaries

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, reviewed 2026-10-04
        with:
          toolchain: '1.96'
          targets: ${{ matrix.target }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: bash scripts/install-linux-deps.sh

      - name: Verify macOS Metal compiler
        if: runner.os == 'macOS'
        run: |
          xcrun --find metal
          xcrun --find metallib

      - name: Verify Windows SDK shader compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\fxc.exe' |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $compiler) { throw 'GPUI release builds require the Windows SDK fxc.exe compiler' }
          "GPUI_FXC_PATH=$($compiler.FullName)" >> $env:GITHUB_ENV

      # Keep compiled outputs out of shared caches: build identity must describe
      # this checkout. Registry/git data contain no signing or release secrets.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: native-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      - name: Test on the native platform
        run: cargo test --locked --workspace

      - name: Build native release executable
        run: cargo build --locked --release -p markrust --target "$BUILD_TARGET"
        env:
          BUILD_TARGET: ${{ matrix.target }}
          MACOSX_DEPLOYMENT_TARGET: '11.0'

      - name: Smoke and package the exact target executable
        run: |
          binary="target/$BUILD_TARGET/release/markrust"
          if [[ "$RUNNER_OS" == 'Windows' ]]; then binary="$binary.exe"; fi
          python scripts/package-release.py --target "$BUILD_TARGET" --binary "$binary" --commit "$GITHUB_SHA"
        env:
          BUILD_TARGET: ${{ matrix.target }}
          MARKRUST_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: markrust-${{ matrix.target }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
