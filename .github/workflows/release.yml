name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

# A rerun must not cancel a verified publication halfway through uploading.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: tag matches workspace version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate release tag
        run: python3 scripts/package-release.py --check-tag
        env:
          MARKRUST_RELEASE_TAG: ${{ github.ref_name }}

  verify:
    name: release verification
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, reviewed 2026-10-04
        with:
          toolchain: '1.96'
          components: rustfmt, clippy
      - name: Install Linux GUI dependencies
        run: bash scripts/install-linux-deps.sh
      - name: Release packaging contracts
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run Rust test suite
        run: cargo test --locked --workspace

  verify-macos:
    name: native macOS release verification
    needs: version
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, reviewed 2026-10-04
        with:
          toolchain: '1.96'
      - name: Verify macOS shader toolchain
        run: |
          xcrun --find metal
          xcrun --find metallib
      - name: Run native Rust test suite
        # Geometry-only still compiles GPUI's bundled Metal shaders.
        run: cargo test --locked --workspace
      - name: UI contract fault-injection tests
        run: cargo test --locked -p markrust-app --features gui-tests --lib
      - name: Verify native GUI layout and input
        run: >-
          cargo run --locked -p markrust-app --features gui-tests
          --example gui_regression -- --geometry-only
          --output target/gui-regression
      - name: Upload native GUI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-gui-regression
          path: target/gui-regression/
          if-no-files-found: warn
          retention-days: 14

  verify-website:
    name: website release verification
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install website dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --dir website exec playwright install --with-deps chromium
      - name: Run website unit + e2e tests
        run: pnpm --dir website test

  build:
    needs: [verify, verify-macos, verify-website]
    uses: ./.github/workflows/build-binaries.yml
    permissions:
      contents: read

  release:
    name: publish verified version-tag assets
    needs: [version, verify, verify-macos, verify-website, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Only archives from this run's native build jobs, never GUI evidence or
      # another workflow's artifacts. No checkout/build code receives write access.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: markrust-*-${{ github.sha }}
          path: artifacts
          merge-multiple: true
      - name: Verify complete native matrix and archive checksums
        shell: bash
        run: |
          cd artifacts
          for archive in markrust-macos-aarch64.tar.gz markrust-macos-x86_64.tar.gz markrust-linux-x86_64.tar.gz markrust-windows-x86_64-experimental.zip; do
            test -s "$archive"
            test -s "$archive.sha256"
            sha256sum -c "$archive.sha256"
          done
      - name: Create GitHub Release
        # `gh release create` fails if the tag already has a release: a rerun
        # cannot silently replace previously published binaries/checksums.
        shell: bash
        run: |
          options=(--repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --notes "$RELEASE_NOTES")
          if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" "${options[@]}" artifacts/*.tar.gz artifacts/*.zip artifacts/*.sha256
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_NOTES: |
            Native macOS (Apple Silicon + Intel), Linux x86_64, and **experimental Windows x86_64** builds.
            Each archive includes compiled version/build time, source commit, license notices, and a SHA-256 sidecar.
            macOS is ad-hoc signed, not Developer-ID signed or notarized. Windows is not Authenticode signed.
            Windows native editor, clipboard, IME, and recovery-directory ACL/locking acceptance remain pending.
            Linux requires a compatible X11/Wayland desktop, Vulkan graphics, and shared system libraries; it is not an AppImage.
