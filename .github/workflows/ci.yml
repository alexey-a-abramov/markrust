name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, reviewed 2026-10-04
        with:
          toolchain: 1.96
          components: rustfmt, clippy

      - name: Install Linux GUI dependencies
        run: bash scripts/install-linux-deps.sh

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: Release packaging contracts
        run: python3 -m unittest discover -s scripts/tests -v

      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked --workspace

  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install website dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --dir website exec playwright install --with-deps chromium

      - name: Website unit + e2e tests
        run: pnpm --dir website test

  minimum-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install minimum supported Rust (1.96)
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, reviewed 2026-10-04
        with:
          toolchain: 1.96

      - name: Install Linux GUI dependencies
        run: bash scripts/install-linux-deps.sh

      - name: cargo check (minimum toolchain)
        run: cargo check --locked -p markrust-core -p markrust-editor -p markrust

  macos-native-smoke:
    name: native macOS smoke
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, reviewed 2026-10-04
        with:
          toolchain: 1.96

      # This is deliberately a native-host build, not a cross compile. It
      # catches macOS/GPUI integration regressions and proves the packaged CLI
      # can execute without opening a GUI window.
      - name: Verify macOS shader toolchain
        run: |
          xcrun --find metal
          xcrun --find metallib

      - name: Run native Rust test suite
        run: cargo test --locked --workspace

      - name: Build and smoke native release binary
        run: |
          cargo build --locked --release -p markrust
          ./target/release/markrust --version

      # CoreText shaping + real GPUI layout/input, without requiring a GPU on
      # GitHub's virtual Macs. The same runner captures Metal screenshots on
      # a developer Mac; see docs/gui-testing.md for reviewed pixel baselines.
      - name: UI contract fault-injection tests
        run: cargo test --locked -p markrust-app --features gui-tests --lib

      - name: Native GUI layout and interaction regressions
        run: >-
          cargo run --locked -p markrust-app --features gui-tests
          --example gui_regression -- --geometry-only
          --output target/gui-regression

      - name: Upload GUI regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-gui-regression
          path: target/gui-regression/
          if-no-files-found: warn
          retention-days: 14

  binaries:
    name: downloadable native builds
    needs: [check, website, minimum-toolchain, macos-native-smoke]
    uses: ./.github/workflows/build-binaries.yml
    permissions:
      contents: read
