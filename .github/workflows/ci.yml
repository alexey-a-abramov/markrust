name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96
          components: rustfmt, clippy

      - name: Install Linux GUI dependencies
        run: bash scripts/install-linux-deps.sh

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install website dependencies
        run: pnpm install

      - name: Install Playwright Chromium
        run: pnpm --dir website exec playwright install --with-deps chromium

      - name: Website unit + e2e tests
        run: pnpm --dir website test

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.96 (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96

      - name: Install Linux GUI dependencies
        run: bash scripts/install-linux-deps.sh

      - name: cargo check (MSRV)
        run: cargo check -p markrust-core -p markrust-editor -p markrust
