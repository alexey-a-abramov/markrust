[package]
name = "markrust-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "GPUI application shell for MarkRust (not published to crates.io)"
publish = false

[dependencies]
markrust-core = { path = "../markrust-core" }
markrust-editor = { path = "../markrust-editor" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "8166e3d7b8b42d8aaf4d4dee7fcd25ab4ec65105" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "8166e3d7b8b42d8aaf4d4dee7fcd25ab4ec65105", package = "gpui_platform", features = ["font-kit"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "6.0"
notify = "8.0"
thiserror = "2.0"
anyhow = "1.0"
unicode-segmentation = "1.12"
image = { version = "0.25", default-features = false, features = ["png"] }
